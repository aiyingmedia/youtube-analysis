name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 pyproject 宣告的下限，3.12 是目前常見版本
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安裝
        # 不裝 asr extra：faster-whisper 連模型權重有數 GB，
        # 而測試全部離線、不需要真的跑語音辨識。
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,zh]'

      - name: Lint
        run: ruff check .

      - name: 測試
        run: pytest -q
