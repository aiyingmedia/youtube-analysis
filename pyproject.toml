[project]
name = "ytreel"
version = "0.1.0"
description = "輸入 YouTube 連結，自動產出摘要、重點整理與 IG Reel 口播稿"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
zh = ["opencc-python-reimplemented>=0.1.7"]
all = ["faster-whisper>=1.0", "opencc-python-reimplemented>=0.1.7"]
dev = ["pytest>=8.0"]

[project.scripts]
ytreel = "ytreel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
