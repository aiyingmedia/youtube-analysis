[project]
name = "ytreel"
version = "0.1.0"
description = "輸入 YouTube 連結，自動產出摘要、重點整理與 IG Reel 口播稿"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    # [default] 會帶入 yt-dlp-ejs（YouTube 播放驗證的解題腳本），缺了它格式會缺、
    # 字幕會漏判。YouTube 改版頻繁，太舊的 yt-dlp 基本上無法使用。
    "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
zh = ["opencc-python-reimplemented>=0.1.7"]
all = ["faster-whisper>=1.0", "opencc-python-reimplemented>=0.1.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ytreel = "ytreel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# F = pyflakes（未使用的 import、未定義的名稱等真錯誤）
# E9 = 語法與執行期錯誤
# I  = import 排序
# 刻意不開格式類規則：這個專案不跑 formatter，開了只會製造雜訊。
select = ["F", "E9", "I"]
